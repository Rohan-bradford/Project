<!doctype html>
<!-- File: base.html -->
<!-- This shared template holds the common layout, hero image, navigation, and footer. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marshfield School History</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="{% if is_child_page %}child-page{% endif %}">
  <main class="page">
    <header>
      <h1>{{ page_title }}</h1>
    </header>
    <div class="hero" style="background-image: url('{{ hero_image_url }}');" aria-label="School background image"></div>
    <nav>
      {% for label, target in nav %}
      <a href="{{ url_for('render_page', page=target) }}" class="{% if current_page == target %}active{% endif %}">{{ label }}</a>
      {% endfor %}
    </nav>
    {% block content %}{% endblock %}
    <section class="page-controls">
      <a href="javascript:history.back()">Previous page</a>
      <a href="javascript:history.forward()">Next page</a>
      <a href="{{ url_for('render_page', page=home_target) }}">Home</a>
    </section>
    <footer>Community History Research by Ray Greenhough</footer>
  </main>

  <!-- Global media viewer so PDF and image links can open inside the page. -->
  <div id="mediaViewer" class="media-viewer" aria-hidden="true">
    <div class="media-viewer-backdrop" data-close="true"></div>
    <section class="media-viewer-dialog" role="dialog" aria-modal="true" aria-label="Document viewer">
      <header class="media-viewer-header">
        <h2 id="mediaViewerTitle">Document viewer</h2>
        <button type="button" id="mediaViewerClose" class="media-viewer-close" aria-label="Close viewer">Close</button>
      </header>
      <div class="media-viewer-body">
        <img id="mediaViewerImage" alt="Selected source image" hidden>
        <iframe id="mediaViewerFrame" title="Selected source file" hidden></iframe>
      </div>
      <footer class="media-viewer-footer">
        <button type="button" id="mediaViewerPrev" class="media-viewer-nav">Previous</button>
        <button type="button" id="mediaViewerNext" class="media-viewer-nav">Next</button>
        <button type="button" id="mediaViewerHome" class="media-viewer-nav" data-home-url="{{ url_for('render_page', page=viewer_home_target) }}">Home</button>
      </footer>
    </section>
  </div>

  <script src="{{ url_for('static', filename='js/media-viewer.js') }}"></script>
</body>
</html>
